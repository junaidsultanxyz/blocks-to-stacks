# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Pushing a tag additionally publishes the built jars to a GitHub Release.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      # Needed by the release step below; harmless on ordinary pushes.
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          # Release notes are generated by diffing against the previous tag.
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Keep in sync with java_version in gradle.properties. Gradle can provision
      # the JDK itself via gradle/gradle-daemon-jvm.properties, this just avoids
      # paying for that download on every run.
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --generate-notes
