# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Toolchain / Minecraft target.
#
# Porting to a newer Minecraft release should normally only require editing
# this block. See PORTING.md for the full checklist.
# Recommended values live at https://fabricmc.net/develop
# ---------------------------------------------------------------------------
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.157.0+26.2

# Java release the target Minecraft version runs on (26.2 -> 25).
java_version=25

# Ranges baked into fabric.mod.json. Space separated terms are ANDed together.
# Widen the upper bound only after the mod has actually been tested on it.
minecraft_dependency=>=26.2 <26.3
loader_dependency=>=0.19.3

# Mod Properties
mod_version=2.0.0
maven_group=com.junaidsultan
archives_base_name=blockstostacks
